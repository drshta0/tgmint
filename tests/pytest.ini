[pytest]
# No asyncio_mode here: pytest-asyncio is not a dependency (the suite drives
# coroutines through unittest.IsolatedAsyncioTestCase and asyncio.run), and
# declaring the option anyway only made pytest warn
# "Unknown config option: asyncio_mode" on every run (review finding: harmless
# warning). If pytest-asyncio is ever added, re-add the option in the same
# commit as the dependency.
testpaths = tests
