[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgmint"
version = "1.18.1"
description = "tgmint — opentele lineage: tdata/telethon conversion, official-API fingerprints, software passkeys"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "thedemons" }]
maintainers = [{ name = "tgmint authors" }]
keywords = ["tdata", "tdesktop", "telegram", "telethon", "tgmint", "session", "fingerprint", "passkeys"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "telethon>=1.24,<2",
    "tgcrypto",
]

[project.optional-dependencies]
# tdata read/write uses a pure-Python QDataStream by default (no Qt needed);
# the [qt] extra keeps the PyQt5 path available as a fallback (set
# TGMINT_TDATA_QT=1) and for equivalence testing.
qt = ["pyqt5"]
# cryptography is needed only for passkey create/sign (tgmint.passkeys).
passkeys = ["cryptography"]

[project.urls]
Homepage = "https://github.com/drshta0/tgmint"
Repository = "https://github.com/drshta0/tgmint"
Issues = "https://github.com/drshta0/tgmint/issues"
Changelog = "https://github.com/drshta0/tgmint/blob/main/CHANGELOG.md"
Upstream = "https://github.com/thedemons/opentele"

[project.scripts]
# python -m tgmint also works (src/tgmint/__main__.py); same zero-dependency
# argparse CLI (mint | inspect | audit | freshness | parity | convert | doctor).
tgmint = "tgmint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tgmint"]

[tool.hatch.build.targets.sdist]
include = ["src/tgmint", "README.md", "LICENSE", "FORK.md", "CHANGELOG.md", "selfcheck.py"]
