[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgmint"
version = "1.15.1.post5"
description = "tgmint — opentele lineage: tdata/telethon conversion, official-API fingerprints, software passkeys"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "thedemons" }]
maintainers = [{ name = "tgmint authors" }]
keywords = ["tdata", "tdesktop", "telegram", "telethon", "tgmint", "session", "fingerprint", "passkeys"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "telethon>=1.24,<2",
    "tgcrypto",
]

[project.optional-dependencies]
# PyQt5 is needed only for tdata (Telegram Desktop session folder) read/write.
# The import is lazy: TelegramClient / API.Generate / session minting work
# without Qt. A pure-Python replacement is planned (PLAN.md, step 4).
qt = ["pyqt5"]
# cryptography is needed only for passkey create/sign (tgmint.passkeys).
passkeys = ["cryptography"]

[project.urls]
Homepage = "https://github.com/thedemons/opentele"
Upstream = "https://github.com/thedemons/opentele"

[tool.hatch.build.targets.wheel]
packages = ["src/tgmint"]

[tool.hatch.build.targets.sdist]
include = ["src/tgmint", "README.md", "LICENSE", "FORK.md", "CHANGELOG.md", "selfcheck.py"]
