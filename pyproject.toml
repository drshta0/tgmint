[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tgmint"
version = "1.18.1"
description = "tgmint — opentele lineage: tdata/telethon conversion, official-API fingerprints, software passkeys"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "thedemons" }]
maintainers = [{ name = "drshta0" }]
keywords = ["tdata", "tdesktop", "telegram", "telethon", "tgmint", "session", "fingerprint", "passkeys"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "telethon>=1.24,<2",
    "tgcrypto",
]

[project.optional-dependencies]
# tdata read/write uses a pure-Python QDataStream by default (no Qt needed);
# the [qt] extra keeps the PyQt5 path available as a fallback (set
# TGMINT_TDATA_QT=1) and for equivalence testing.
qt = ["pyqt5"]
# cryptography is needed only for passkey create/sign (tgmint.passkeys).
passkeys = ["cryptography"]

[project.urls]
Homepage = "https://github.com/drshta0/tgmint"
Repository = "https://github.com/drshta0/tgmint"
Issues = "https://github.com/drshta0/tgmint/issues"
Changelog = "https://github.com/drshta0/tgmint/blob/main/CHANGELOG.md"
Upstream = "https://github.com/thedemons/opentele"

[project.scripts]
# python -m tgmint also works (src/tgmint/__main__.py); same zero-dependency
# argparse CLI (mint | inspect | audit | freshness | parity | convert |
# verify | login-passkey | login-qr | profile | heal | bootstrap | cadence |
# doctor).
tgmint = "tgmint.cli:main"

# Lint ratchet (chore/lint-ratchet): CI previously ran a smoke-only
# E9,F63,F7 pass. The set below raises the bar without changing behavior.
# - UP007/UP045 (PEP 604 `X | Y` annotations) are ignored on purpose:
#   `X | None` raises TypeError when annotations are evaluated on
#   Python 3.9 (PEP 604 needs 3.10+), and this package supports >=3.9.
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F401", "F811", "F841", "B006", "B008", "UP"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
# td/configs.py, tl/configs.py, td/shared.py and tl/shared.py are legacy
# import hubs: sibling modules pull names from them via `from .configs
# import *` (and downstream code imports from tgmint.td.shared), so their
# top-level imports are re-exports. Adding __all__ there would silently
# change what the star-imports deliver, so F401 is waived per-file instead.
"src/tgmint/td/configs.py" = ["F401", "UP035"]
"src/tgmint/tl/configs.py" = ["F401", "UP035"]
"src/tgmint/td/shared.py" = ["F401"]
"src/tgmint/tl/shared.py" = ["F401"]

[tool.hatch.build.targets.wheel]
packages = ["src/tgmint"]

[tool.hatch.build.targets.sdist]
include = ["src/tgmint", "README.md", "LICENSE", "FORK.md", "CHANGELOG.md", "selfcheck.py"]
