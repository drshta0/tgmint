# Dependabot: weekly dependency bumps.
# - pip: pyproject.toml at the repo root (runtime deps + extras)
# - github-actions: the workflows under .github/workflows/
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
