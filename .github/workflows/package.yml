name: package

on:
  push:
    branches: [ main, develop ]
    paths:
    - 'src/**'
    - 'tests/**'
    - '.github/**'
    - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'tests/**'
    - '.github/**'
    - 'pyproject.toml'

jobs:
  build:

    # Pinned to 24.04: ubuntu-latest is migrating to 26.04, which has no
    # Python 3.9 builds, so the 3.9 matrix cell fails before running tests.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # kurigram: without a Pyrogram-family package installed, the
        # Pyrogram passkey / cadence / QR / adapter tests skip silently.
        python -m pip install -e .[qt,passkeys] kurigram pytest

    - name: Running tests
      run: |
        # pytest (not unittest discover): it also collects the plain
        # function tests and applies tests/conftest.py.
        python -m pytest -q -rs
