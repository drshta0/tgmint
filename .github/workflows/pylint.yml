# Ruff runs from the repo's pyproject.toml config ([tool.ruff.lint]):
# E9/F63/F7 (breakage) plus F401, F811, F841, B006, B008 and the UP
# pyupgrade rules, at target-version py39. UP007/UP045 are excluded
# there on purpose (PEP 604 `X | Y` annotations cannot be evaluated on
# Python 3.9); see pyproject.toml for the full rationale.

name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff
    - name: Ruff lint (pyproject config)
      run: |
        ruff check src tests
