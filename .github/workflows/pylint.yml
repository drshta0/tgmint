# Smoke lint only: E9 (syntax errors), F63 (invalid logic), F7 (syntax
# errors in futures). The legacy codebase is not yet ruff-clean under the
# full rule set and that's fine — this job exists to catch outright
# breakage, not style.

name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff
    - name: Ruff smoke lint
      run: |
        ruff check src tests --select E9,F63,F7
