site_name: tgmint
site_description: >-
  Telegram identity toolkit: convert sessions between tdata, Telethon, the
  Pyrogram family and GramJS; mint official-client fingerprints from live,
  verified data; log in with software passkeys.
site_author: "tgmint authors (upstream: thedemons)"
repo_url: https://github.com/drshta0/tgmint
repo_name: drshta0/tgmint
edit_uri: edit/main/docs/
copyright: >-
  MIT · tgmint authors, continuing
  <a href="https://github.com/thedemons/opentele/">thedemons/opentele</a>

docs_dir: docs
exclude_docs: |
  build/
  hooks/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - docs/hooks/cli_reference.py

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]
            show_if_no_docstring: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Getting started: getting-started.md
  - How it works: concepts.md
  - Frameworks:
      - frameworks/index.md
      - Telethon: frameworks/telethon.md
      - Pyrogram / kurigram / pyrofork: frameworks/pyrogram.md
      - Hydrogram: frameworks/hydrogram.md
      - GramJS (Node.js): frameworks/gramjs.md
      - MadelineProto (PHP): frameworks/madelineproto.md
      - TDLib: frameworks/tdlib.md
      - Bot API: frameworks/bot-api.md
  - Guides:
      - Passkeys: passkeys.md
      - QR login: qr-login.md
      - Android import: android-acquisition.md
      - Startup like the real app: bootstrap.md
      - Ping timing like the real app: cadence.md
      - Migrating from opentele: migration-from-opentele.md
  - CLI: cli.md
  - API reference:
      - reference/index.md
      - Presets & devices: reference/api.md
      - Device identity: reference/fingerprint.md
      - Session codec: reference/codec.md
      - Telegram Desktop (tdata): reference/td.md
      - Telethon client: reference/tl.md
      - Pyrogram adapter: reference/adapters.md
      - Passkeys: reference/passkeys.md
      - QR login: reference/qrlogin.md
      - Account backup & heal: reference/profile.md
      - Ping timing & startup: reference/cadence.md
      - Versions, layers & parity: reference/versions.md
      - Exceptions: reference/exceptions.md
